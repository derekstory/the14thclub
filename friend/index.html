<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Add a friend — The 14th Club</title>
  <meta name="description" content="Add a friend in The 14th Club and play golf together.">
  <link rel="icon" href="../icon.png">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#0a1a10; color:#f2efe6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; padding: max(32px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom)); display:grid; place-items:center; }
    main { width:100%; max-width:460px; }
    .brand { display:flex; align-items:center; gap:14px; color:#f2efe6; text-decoration:none; font-family:Georgia,serif; font-size:1.4rem; margin-bottom:36px; }
    .brand img { width:54px; height:54px; border-radius:12px; }
    h1 { font-family:Georgia,serif; font-size:clamp(2rem,8vw,2.8rem); line-height:1.1; font-weight:500; margin:0 0 20px; }
    p { line-height:1.6; font-size:1rem; margin:14px 0; }
    #name { color:#f5c518; font-size:1.4rem; overflow-wrap:anywhere; white-space:pre-wrap; }
    .card { background:#17391f; padding:24px; border-radius:16px; margin:24px 0; }
    .label { margin:0 0 12px; color:#d1d8ce; }
    #code { display:block; font-family:ui-monospace,monospace; font-size:clamp(1.45rem,6vw,2rem); letter-spacing:.12em; overflow-wrap:anywhere; user-select:all; }
    a.action, button { display:block; width:100%; text-align:center; padding:16px; border-radius:12px; font:600 1rem/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; cursor:pointer; text-decoration:none; }
    .action { background:#f5c518; color:#173118; margin-top:16px; }
    button { margin-top:18px; border:1px solid #738373; background:transparent; color:#f2efe6; }
    #store { background:transparent; border:1px solid #738373; color:#f2efe6; }
    :focus-visible { outline:3px solid #f5c518; outline-offset:5px; }
    .hint, #copy-status { color:#d1d8ce; font-size:.95rem; }
    #copy-status:empty { display:none; }
    [hidden] { display:none !important; }
    footer { margin-top:32px; }
    footer a { color:#d1d8ce; text-underline-offset:4px; }
  </style>
  <script type="module" src="./friend.js"></script>
</head>
<body>
<main>
  <a class="brand" href="../"><img src="../icon.png" alt="" width="54" height="54">The 14th Club</a>
  <h1 data-copy="title">Add a friend</h1>
  <p id="name" hidden></p>
  <p id="intro" data-copy="intro">Open the game to review this friend request.</p>
  <div id="friend" hidden>
    <div class="card">
      <p class="label" data-copy="code">Friend code</p>
      <strong id="code"></strong>
      <button id="copy" type="button" data-copy="copy">Copy code</button>
      <p id="copy-status" role="status" aria-live="polite"></p>
    </div>
    <a id="open" class="action" data-copy="open">Open The 14th Club</a>
    <p class="hint" data-copy="install">After installing, tap your original link again or enter this code in Friends.</p>
  </div>
  <a id="store" class="action" href="https://apps.apple.com/app/id6805187819" rel="noreferrer" data-copy="store" hidden>View on the App Store</a>
  <p id="prelaunch" class="hint" data-copy="prelaunch">Coming soon to the App Store. Already have the game? You can open it above.</p>
  <noscript><p>Enable JavaScript to view the friend code and open the game.</p></noscript>
  <footer><a href="../support/" data-copy="support">Support</a></footer>
</main>
</body>
</html>
